<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="t">
<title id="t">Malik Moussaoui aka Chopa</title>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; }
  text:not([fill]) { fill: #17172b; }
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  .muted { fill: #64647d; }
  .title { font-size: 17px; font-weight: 700; }
  .fade { animation: fade .6s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed"/><stop offset=".55" stop-color="#0891b2"/><stop offset="1" stop-color="#db2777"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset=".5" stop-color="#e3e1f0"/><stop offset="1" stop-color="#0891b2" stop-opacity=".45"/>
  </linearGradient>
</defs>
<rect x=".5" y=".5" width="1199" height="299" rx="14" fill="#ffffff" stroke="url(#edge)"/>

<defs>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <clipPath id="clip"><rect width="1200" height="300" rx="14"/></clipPath>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#7c3aed"/><stop offset=".33" stop-color="#0891b2"/>
    <stop offset=".66" stop-color="#db2777"/><stop offset="1" stop-color="#7c3aed"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  @keyframes drift1 { to { transform: translate(90px, 40px); } }
  @keyframes drift2 { to { transform: translate(-110px, -50px); } }
  @keyframes blink { 50% { opacity: 0; } }
  .name { font-size: 76px; font-weight: 800; letter-spacing: -2px; }
  .sub { font-size: 24px; font-weight: 500; }
</style>
<g clip-path="url(#clip)">
  
  <g filter="url(#blur)" opacity=".75">
    <circle cx="230" cy="80" r="170" fill="#7c3aed" style="animation: drift1 14s ease-in-out infinite alternate"/>
    <circle cx="980" cy="230" r="190" fill="#0891b2" style="animation: drift2 17s ease-in-out infinite alternate"/>
    <circle cx="640" cy="320" r="140" fill="#db2777" opacity=".7" style="animation: drift1 20s ease-in-out infinite alternate-reverse"/>
  </g>
  <rect width="1200" height="300" fill="#ffffff" opacity=".55"/>
  <g stroke="#17172b" stroke-opacity=".05"><path d="M0 0V300" /><path d="M40 0V300" /><path d="M80 0V300" /><path d="M120 0V300" /><path d="M160 0V300" /><path d="M200 0V300" /><path d="M240 0V300" /><path d="M280 0V300" /><path d="M320 0V300" /><path d="M360 0V300" /><path d="M400 0V300" /><path d="M440 0V300" /><path d="M480 0V300" /><path d="M520 0V300" /><path d="M560 0V300" /><path d="M600 0V300" /><path d="M640 0V300" /><path d="M680 0V300" /><path d="M720 0V300" /><path d="M760 0V300" /><path d="M800 0V300" /><path d="M840 0V300" /><path d="M880 0V300" /><path d="M920 0V300" /><path d="M960 0V300" /><path d="M1000 0V300" /><path d="M1040 0V300" /><path d="M1080 0V300" /><path d="M1120 0V300" /><path d="M1160 0V300" /><path d="M0 0H1200" /><path d="M0 40H1200" /><path d="M0 80H1200" /><path d="M0 120H1200" /><path d="M0 160H1200" /><path d="M0 200H1200" /><path d="M0 240H1200" /><path d="M0 280H1200" /></g>
</g>
<text x="600" y="78" text-anchor="middle" class="mono muted fade" font-size="17">~ $ whoami</text>
<text x="600" y="168" text-anchor="middle" class="name fade" style="animation-delay:.15s" fill="url(#shine)">Malik Moussaoui</text>
<text x="600" y="218" text-anchor="middle" class="sub fade" style="animation-delay:.35s">aka <tspan font-weight="800" fill="url(#grad)">Chopa</tspan> · développeur full-stack &amp; créateur de jeux</text>
<g class="fade" style="animation-delay:.55s">
  <text x="600" y="262" text-anchor="middle" class="mono muted" font-size="15">TypeScript · Lua · FiveM · Roblox · IA<tspan fill="#0891b2" style="animation: blink 1s steps(1) infinite"> ▍</tspan></text>
</g>
</svg>
